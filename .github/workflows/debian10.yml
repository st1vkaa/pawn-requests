name: Debian 10 build (sscanf)

on:
  push:
    branches: [sscanf-omp]
  workflow_dispatch:

jobs:
  linux-buster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in debian:buster
        run: docker run --rm -v "$PWD":/src -w /src debian:buster bash ci/build-buster.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sscanf-2.15.1-debian10
          if-no-files-found: warn
          path: out/
